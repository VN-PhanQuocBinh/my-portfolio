<!doctype html>
<html lang="en" data-theme="cobalt" data-mode="light"><head>
<meta charset="UTF-8"/>
<script>
  try {
    const theme = localStorage.getItem('portfolio-theme');
    const mode = localStorage.getItem('portfolio-mode');
    const root = document.documentElement;
    root.dataset.theme = ['cobalt', 'prussian', 'azure', 'graphite', 'stone'].includes(theme) ? theme : 'cobalt';
    root.dataset.mode = mode === 'dark' ? 'dark' : 'light';
  } catch {}
</script>
<style>
  html[data-mode="dark"] { color-scheme: dark; background-color: #0A0D14; }
